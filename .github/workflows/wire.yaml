name: centrient-wire

# Standalone by design: no dependency on, and no writes into, the generic newsflow engine.
# Hourly news sweep; the script decides the daily data leg (first run from 04:00 UTC, with
# retry-until-landed), the Monday broker-PDF leg, and the monthly trade mirror (from the 25th).
# Commit step is race-proof: full-history checkout, and if the push is rejected because main
# moved mid-run (including manual uploads during a run), merge preferring this run's generated
# files, then retry. Never rebase here — a shallow rebase turns every generated file into an
# add/add conflict.

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      force_data:    {description: "Run the daily price leg now",        type: boolean, default: false}
      force_weekly:  {description: "Run the Eastmoney broker-PDF leg",   type: boolean, default: false}
      force_monthly: {description: "Run the Comtrade/Comext trade leg",  type: boolean, default: false}

permissions:
  contents: write

concurrency:
  group: centrient-wire
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}

      - run: pip install -r requirements.txt

      - name: Run the wire
        env:
          FORCE_DATA:    ${{ inputs.force_data }}
          FORCE_WEEKLY:  ${{ inputs.force_weekly }}
          FORCE_MONTHLY: ${{ inputs.force_monthly }}
          COMTRADE_KEY:  ${{ secrets.COMTRADE_KEY }}
        run: python wire/run.py

      - name: Commit (race-proof)
        run: |
          git config user.name "centrient-wire-bot"
          git config user.email "centrient-wire-bot@users.noreply.github.com"
          git add data docs
          if ! git commit -m "wire $(date -u +%Y-%m-%dT%H:%MZ) [skip ci]"; then
            echo "nothing to commit"; exit 0
          fi
          for i in 1 2 3; do
            if git push origin "HEAD:${{ github.ref_name }}"; then
              exit 0
            fi
            echo "push rejected, merging origin (our generated files win) and retrying ($i)"
            git fetch origin "${{ github.ref_name }}"
            git merge -s ort -X ours --no-edit "origin/${{ github.ref_name }}" || true
          done
          echo "push failed after retries"; exit 1
